name: Auto Screenshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Ek samay par sirf ek hi workflow chalega, duplicate nahi honge
concurrency:
  group: screenshot-runner
  cancel-in-progress: false

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Continuous Screenshot Loop (1 Hour)
        run: python script.py

      - name: Auto-Trigger Next Run Immediately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run auto_screenshot.yml || true
